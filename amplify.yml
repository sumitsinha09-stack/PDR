version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm --prefix pdr-frontend install
    build:
      commands:
        - npm --prefix pdr-frontend run build
  artifacts:
    baseDirectory: pdr-frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - pdr-frontend/node_modules/**/*
