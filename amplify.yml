version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd pdr-frontend && npm install
    build:
      commands:
        - cd pdr-frontend && npm run build
  artifacts:
    baseDirectory: pdr-frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - pdr-frontend/node_modules/**/*
